id: EV-20260926-008
classification: STATED_BUT_UNVERIFIED
claim: >
  The join-form program (PR #122, merged 2026-09-26) shipped a live
  application-form UI on /join/ behind the submitForm() adapter boundary
  with a mock adapter that always returns `unavailable` — i.e. UI ahead of
  any endpoint, with no success state and no data sent or stored. This
  invalidates FORM-CONTRACT.md's "Do not implement yet" section ("No form
  is implemented at this contract freeze", lines 41-50), which was true at
  freeze time and is now history. The boundary rules, invariants, and
  forbidden behavior are unaffected: the UI depends only on
  submitForm(payload), imports no provider types, and the validation
  method's mock-adapter unit test exists and runs in CI.
source: "Merged branch state feat/join-form (PR #122, merge 15d2d01) + owner approvals recorded in EV-20260926-006."
