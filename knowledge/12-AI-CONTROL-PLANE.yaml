# AI control plane — compact decision substrate.
# Normative source: contracts/AI-EXECUTION-CONTRACT.md. This file is the
# machine- and agent-readable summary; on conflict, the contract governs.

control_plane:
  version: 1
  frozen: 2026-09-15
  contract: contracts/AI-EXECUTION-CONTRACT.md
  gate_script: scripts/check-control-plane.mjs
  pipeline: REQUESTED -> GROUNDING -> AUDIT -> HISTORY_AUDIT -> IMPACT_ANALYSIS -> PLAN_READY -> IMPLEMENTATION_AUTHORIZED -> IMPLEMENTING -> VERIFYING -> ADVERSARIAL_REVIEW -> RELEASE_GATE -> COMPLETE
  failure_state: BLOCKED

decision_rules:
  - id: DR-C01
    rule: No code changes before PLAN_READY exit evidence exists (bounded approved plan).
    enforces: P7 absolute principle
  - id: DR-C02
    rule: Every uncertain claim is UNKNOWN; model memory never overrides repository evidence.
    enforces: P17 grounding-truth hierarchy
  - id: DR-C03
    rule: UNKNOWN stays UNKNOWN, unproven invariant means BLOCKED, failing test means NOT READY; never weaken a check to obtain PASS.
    enforces: fail-closed model
  - id: DR-C04
    rule: Read knowledge/ and applicable contracts before any project-level decision; scan artifacts/adaptive-learning/INDEX.yaml and apply the recorded fix on recurrence.
    enforces: P1, P15
  - id: DR-C05
    rule: Inspect git history (log/blame/show) for every file touched and every architectural assumption reused.
    enforces: P3 HISTORY_AUDIT
  - id: DR-C06
    rule: Architectural/config/dependency changes require a CHANGE_IMPACT_MATRIX covering all 16 dimensions; UNKNOWN cells block.
    enforces: P10
  - id: DR-C07
    rule: Declare the change budget (expected/forbidden files, allowed/forbidden deps, scope limit) before implementing; out-of-budget change means BLOCKED.
    enforces: P19
  - id: DR-C08
    rule: Define the failing test before fixing risky behavior; tests prove observable contracts, not implementation details.
    enforces: P20
  - id: DR-C09
    rule: LOCAL_BUILD PASS never implies PRODUCTION PASS; deployment succeeds only on post-deploy smoke PASS.
    enforces: P23
  - id: DR-C10
    rule: Final status is exactly one of VERIFIED, VERIFIED_WITH_LIMITATIONS, BLOCKED, FAILED — with cited evidence or named gaps.
    enforces: P25
  - id: DR-C11
    rule: New dependencies need WHY/ALTERNATIVES/COST/RISK/REVERSIBILITY/MAINTENANCE/FIT answers plus allowlist passage; prefer existing capability.
    enforces: P18
  - id: DR-C12
    rule: Every repeatable failure becomes a permanent check or a documented operational check; lessons land in ERROR-CATALOG.md or knowledge facts.
    enforces: P15, P16

architecture_invariants:
  - id: INV-C01
    invariant: Single authoritative instruction per rule; new files extend existing governance (contracts/, knowledge/, scripts/) instead of forking parallel systems.
  - id: INV-C02
    invariant: Task states map onto the CLAUDE.md session machine without contradiction; conflicts are defects resolved by amendment.
  - id: INV-C03
    invariant: contracts/ stays frozen-change-by-amendment; knowledge/ stays evidence-linked; scripts/ gates fail closed with explicit status lines.
  - id: INV-C04
    invariant: TinaCMS remains an editorial layer; truth-sensitive content stays code-owned under @ukbt/truth.
  - id: INV-C05
    invariant: Build output is inspected, never assumed; serve mapping is derived from generated artifacts on every build.

state_exit_evidence:
  REQUESTED: scope bounds
  GROUNDING: FILES_INSPECTED plus current SHA
  AUDIT: applicable contracts and knowledge findings
  HISTORY_AUDIT: git refs plus prior-incident check
  IMPACT_ANALYSIS: CHANGE_IMPACT_MATRIX plus RISK and BLOCKER lists
  PLAN_READY: bounded CHANGE_PLAN, TEST_PLAN, ROLLBACK_PLAN, approval
  IMPLEMENTATION_AUTHORIZED: authorization record
  IMPLEMENTING: diff confined to budget
  VERIFYING: fresh runs with exit codes
  ADVERSARIAL_REVIEW: break-attempt record
  RELEASE_GATE: deploy verify PASS plus receipt
  COMPLETE: lesson recorded
