    - "an unsigned template, however detailed its surrounding classification scheme"
    - "LabLaunchPad's own unverified statement, repeated"
  closed_by:
    evidence: [EV-20260826-024, EV-20260826-025]
    how: >
      Not by resolving the authorship conflict with A as originally
      specified above — that conflict is moot, not resolved. Closed
      instead via B2: a genuine, dated, coded Envato Elements License
      Certificate (an "executed instrument" in substance — third-party
